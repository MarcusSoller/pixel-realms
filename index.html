let started=false;
function startAudio(){
  if(started)return;started=true;
  const A=window.AC=new(window.AudioContext||window.webkitAudioContext)();A.resume();
  const M=window.MG=A.createGain();M.gain.setValueAtTime(0,A.currentTime);M.gain.linearRampToValueAtTime(SET.mus*.8,A.currentTime+5);M.connect(A.destination);
  const L=A.sampleRate*4,buf=A.createBuffer(2,L,A.sampleRate);
  for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,2.6)}
  const cv=A.createConvolver();cv.buffer=buf;const wet=A.createGain();wet.gain.value=.7;cv.connect(wet);wet.connect(M);
  const bus=A.createGain();bus.connect(M);bus.connect(cv);
  const dl=A.createDelay();dl.delayTime.value=.46;const fb=A.createGain();fb.gain.value=.38;dl.connect(fb);fb.connect(dl);bus.connect(dl);dl.connect(cv);
  const F=m=>440*Math.pow(2,(m-69)/12);
  const tone=(f,t,d,v,type,att)=>{const o=A.createOscillator(),e=A.createGain();o.type=type;o.frequency.value=f;
    e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(v,t+att);e.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(e);e.connect(bus);o.start(t);o.stop(t+d+.1)};
  const chords=[[48,55,59,64,67],[45,52,57,60,64],[41,48,53,57,60],[43,50,55,59,62]],pent=[72,74,76,79,81,84,86];
  const nb=A.createBuffer(1,A.sampleRate*2,A.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  const ns=A.createBufferSource();ns.buffer=nb;ns.loop=true;
  const bp=A.createBiquadFilter();bp.type='bandpass';bp.frequency.value=600;bp.Q.value=.6;
  const wg=A.createGain();wg.gain.value=.05;
  const lf=A.createOscillator();lf.frequency.value=.09;const lg=A.createGain();lg.gain.value=250;lf.connect(lg);lg.connect(bp.frequency);
  ns.connect(bp);bp.connect(wg);wg.connect(M);ns.start();lf.start();
  const chirp=t=>{const o=A.createOscillator(),e=A.createGain();o.frequency.setValueAtTime(3200,t);o.frequency.exponentialRampToValueAtTime(4600,t+.08);
    e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(.015,t+.02);e.gain.exponentialRampToValueAtTime(.0001,t+.12);
    o.connect(e);e.connect(bus);o.start(t);o.stop(t+.15)};
  let step=0,next=A.currentTime+.3;
  setInterval(()=>{while(next<A.currentTime+1.2){
    const ch=chords[Math.floor(step/16)%4];
    if(step%16==0){ch.forEach(m=>{tone(F(m),next,10,.045,'sine',3);tone(F(m)*1.004,next,10,.03,'triangle',3.5)});tone(F(ch[0]-12),next,9,.12,'sine',.6)}
    if(Math.random()<.6){const m=Math.random()<.45?ch[1+Math.floor(Math.random()*4)]+12:pent[Math.floor(Math.random()*pent.length)];
      tone(F(m),next,3.5,.07,'triangle',.02);tone(F(m)*2,next,2,.015,'sine',.02)}
    if(Math.random()<.05){chirp(next+.1);if(Math.random()<.5)chirp(next+.3)}
    step++;next+=.6}},250);
}
